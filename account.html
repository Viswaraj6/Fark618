<!DOCTYPE html>
<html>
<head>
  <title>My Account</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    #logout {
      position: fixed;
      top: 20px;
      left: 20px;
      background: red;
      color: white;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    #home {
      position: fixed;
      top: 20px;
      right: 20px;
      background: black;
      color: white;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    button {
      background: black;
      color: white;
      padding: 8px;
      border: none;
      margin-top: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- 🔐 LOGIN CHECK -->
<script>
const user = localStorage.getItem("user");

if (!user) {
  window.location.href = "login.html";
}
</script>

<!-- 🔴 Logout -->
<div id="logout" onclick="logout()">Logout</div>

<!-- 🏠 Home -->
<div id="home" onclick="goHome()">Home</div>

<h1>👤 My Account</h1>

<h3 id="welcome"></h3>

<h2>My Orders</h2>
<div id="orders"></div>

<script>

const BASE_URL = "https://fark618-1.onrender.com";

// welcome text
document.getElementById("welcome").innerText =
  "Welcome, " + user;

// logout
function logout() {
  localStorage.removeItem("user");
  window.location.href = "login.html";
}

// go home
function goHome() {
  window.location.href = "index.html";
}

// load orders
function loadOrders() {

  fetch(BASE_URL + "/orders")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data
        .filter(o => o.user === user)
        .forEach(o => {

          html += `
            <div class="card">
              <p><b>Order ID:</b> ${o._id}</p>
              <p><b>Total:</b> ₹${o.total}</p>
              <p><b>Status:</b> ${o.status}</p>

              <button onclick="track('${o._id}')">
                Track Order
              </button>
            </div>
          `;
        });

      if (html === "") {
        html = "<p>No orders found 😢</p>";
      }

      document.getElementById("orders").innerHTML = html;
    })
    .catch(err => {
      console.log(err);
      document.getElementById("orders").innerHTML =
        "<p>Error loading orders ❌</p>";
    });
}

// track
function track(id) {
  window.location.href = "track.html?id=" + id;
}

loadOrders();

</script>

</body>
</html>
