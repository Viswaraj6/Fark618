<!DOCTYPE html>
<html>
<head>
  <title>My Account</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>👤 My Account</h1>

<h3 id="welcome"></h3>

<h2>My Orders</h2>
<div id="orders"></div>

<script>

const BASE_URL = "https://fark618-1.onrender.com";

const user = localStorage.getItem("user");

if (!user) {
  window.location.href = "login.html";
}

document.getElementById("welcome").innerText = "Welcome, " + user;

function loadOrders() {

  fetch(BASE_URL + "/orders")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data
  .filter(o => o.user === user)
  .forEach(o => {

        html += `
          <div class="card">
            <p><b>Order ID:</b> ${o._id}</p>
            <p><b>Total:</b> ₹${o.total}</p>
            <p><b>Status:</b> ${o.status}</p>

            <a href="track.html?id=${o._id}">
              <button>Track</button>
            </a>
          </div>
        `;
      });

      document.getElementById("orders").innerHTML = html;
    });
}

loadOrders();

</script>

</body>
</html>
