<!DOCTYPE html>
<html>
<body>

<h1>Cart</h1>
<div id="items"></div>
<h2 id="total"></h2>
<button onclick="placeOrder()">Place Order</button>

<script>
let cart=JSON.parse(localStorage.getItem("cart"))||[];

function load(){
 let html="",total=0;
 cart.forEach((i,idx)=>{
   total+=i.price;
   html+=`<div>${i.name} ₹${i.price}
   <button onclick="remove(${idx})">X</button></div>`;
 });
 document.getElementById("items").innerHTML=html;
 document.getElementById("total").innerText="Total:"+total;
}

function remove(i){
 cart.splice(i,1);
 localStorage.setItem("cart",JSON.stringify(cart));
 load();
}

function placeOrder(){
 fetch("https://fark618.onrender.com/orders",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     items:cart,
     total:cart.reduce((a,b)=>a+b.price,0)
   })
 }).then(()=>{
   alert("Order placed");
   localStorage.removeItem("cart");
   load();
 });
}

load();
</script>

</body>
</html>
