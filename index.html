<!DOCTYPE html>
<html>
<head>
  <title>FARK 618 Store</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .price {
      color: green;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      background: black;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <h1>FARK 618 Store 🛍️</h1>

  <div id="products">Loading...</div>

  <script>
    // Static product data (no backend needed)
    const data = [
      { name: "Blue Shirt", price: 799 },
      { name: "Black T-Shirt", price: 499 },
      { name: "White Shirt", price: 899 },
      { name: "Grey Hoodie", price: 1299 }
    ];

    let html = "";

    data.forEach(p => {
      html += `
        <div class="card">
          <h3>${p.name}</h3>
          <p class="price">₹${p.price}</p>
          <button>Add to Cart</button>
        </div>
      `;
    });

    document.getElementById("products").innerHTML = html;
  </script>

</body>
</html>
