<!DOCTYPE html>
<html>
<head>
  <title>FARK 618</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    #cart {
      position: fixed;
      top: 20px;
      right: 20px;
      background: black;
      color: white;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    button {
      background: black;
      color: white;
      padding: 10px;
      border: none;
      margin-top: 10px;
    }

    button:disabled {
      background: grey;
    }
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let productsData = [];

document.getElementById("cart").innerText = "Cart: " + cart.length;

function loadProducts() {
  fetch("https://fark618-1.onrender.com/products")
  .then(res => res.json())
  .then(data => {

    productsData = data;

    let html = "";

    data.forEach(p => {
      html += `
        <div class="card">
          <img src="${p.image || 'https://via.placeholder.com/200'}">
          <h3>${p.name}</h3>
          <p>₹${p.price}</p>
          <p>Stock: ${p.stock}</p>

          <button onclick="addToCart('${p._id}')"
            ${p.stock == 0 ? "disabled" : ""}>
            ${p.stock == 0 ? "Out of Stock" : "Add to Cart"}
          </button>
        </div>
      `;
    });

    document.getElementById("products").innerHTML = html;
  })
  .catch(err => {
    console.log("ERROR:", err);
  });
}

function addToCart(id) {

  const product = productsData.find(p => p._id == id);

  if (!product) return;

  if (product.stock <= 0) {
    alert("Out of stock ❌");
    return;
  }

  cart.push({
    id: product._id,
    name: product.name,
    price: product.price,
    image: product.image
  });

  localStorage.setItem("cart", JSON.stringify(cart));

  document.getElementById("cart").innerText = "Cart: " + cart.length;

  fetch("https://fark618-1.onrender.com/products/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: product.name,
      price: product.price,
      stock: product.stock - 1,
      image: product.image
    })
  })
  .then(() => loadProducts());
}

function goToCart() {
  window.location.href = "cart.html";
}

loadProducts();

</script>

</body>
</html>
