<!DOCTYPE html>
<html>
<head>
  <title>FARK 618</title>
</head>
<body>

<h1>FARK 618 Store</h1>

<div id="products"></div>

<script>
fetch("https://your-backend-url.onrender.com/products")
  .then(res => res.json())
  .then(data => {
    document.getElementById("products").innerHTML =
      data.map(p => `<p>${p.name} - ₹${p.price}</p>`).join("");
  });
</script>

</body>
</html>
