<!DOCTYPE html>
<html>
<head>
  <title>FARK 618</title>
</head>
<body>

<div id="cart" onclick="goToCart()">Cart: 0</div>

<h1>Store</h1>
<div id="products"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let productsData = [];

document.getElementById("cart").innerText = "Cart: " + cart.length;

function loadProducts() {
 fetch("https://fark618.onrender.com/products")
 .then(res=>res.json())
 .then(data=>{
   productsData=data;
   let html="";
   data.forEach(p=>{
     html+=`
     <div>
      <img src="${p.image}" width="150">
      <h3>${p.name}</h3>
      <p>${p.price}</p>
      <button onclick="addToCart(${p.id})">Add</button>
     </div>`;
   });
   document.getElementById("products").innerHTML=html;
 });
}

function addToCart(id){
 let p=productsData.find(x=>x.id==id);
 cart.push(p);
 localStorage.setItem("cart",JSON.stringify(cart));

 fetch("https://fark618.onrender.com/products/"+id,{
   method:"PUT",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({...p,stock:p.stock-1})
 }).then(loadProducts);
}

function goToCart(){
 location.href="cart.html";
}

loadProducts();
</script>

</body>
</html>
