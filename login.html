<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }

    input {
      padding: 10px;
      width: 250px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>👤 Customer Login</h1>

<input id="username" placeholder="Enter your name">
<br>
<button onclick="login()">Login</button>

<script>

function login() {
  const name = document.getElementById("username").value;

  if (!name) {
    alert("Enter name ❌");
    return;
  }

  localStorage.setItem("user", name);

  window.location.href = "account.html";
}

</script>

</body>
</html>
