<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 250px;
    }

    button {
      padding: 10px 15px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
    }

    img {
      width: 150px;
    }
  </style>
</head>

<body>

<h1>Admin Panel 🔧</h1>

<!-- 🔐 Login -->
<div id="login">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- 📦 Admin -->
<div id="admin" style="display:none">

  <h2>Add Product</h2>

  <input id="name" placeholder="Name">
  <input id="price" placeholder="Price">
  <input id="stock" placeholder="Stock">
  <input id="image" placeholder="Image URL">

  <button onclick="addProduct()">Add Product</button>

  <h2>All Products</h2>
  <div id="products"></div>

</div>

<script>

// 🔐 Login check
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (user === "admin" && pass === "1234") {
    document.getElementById("login").style.display = "none";
    document.getElementById("admin").style.display = "block";
    loadProducts();
  } else {
    alert("Wrong login");
  }
}

// ➕ Add
function addProduct() {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const stock = document.getElementById("stock").value;
  const image = document.getElementById("image").value;

  fetch("https://fark618.onrender.com/products", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, price, stock, image })
  })
  .then(() => {
    alert("Added!");
    loadProducts();
  });
}

// 📦 Load products
function loadProducts() {
  fetch("https://fark618.onrender.com/products")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data.forEach(p => {
        html += `
          <div class="card">
            <img src="${p.image}" />
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <p>Stock: ${p.stock}</p>

            <button onclick="deleteProduct(${p.id})">Delete</button>
            <button onclick="editProduct(${p.id})">Edit</button>
          </div>
        `;
      });

      document.getElementById("products").innerHTML = html;
    });
}

// ❌ Delete
function deleteProduct(id) {
  fetch("https://fark618.onrender.com/products/" + id, {
    method: "DELETE"
  })
  .then(() => loadProducts());
}

// ✏️ Edit
function editProduct(id) {
  const name = prompt("New name:");
  const price = prompt("New price:");
  const stock = prompt("New stock:");
  const image = prompt("New image:");

  fetch("https://fark618.onrender.com/products/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, price, stock, image })
  })
  .then(() => loadProducts());
}

</script>

</body>
</html>
