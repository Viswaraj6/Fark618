<!DOCTYPE html>
<html>
<body>

<h1>Admin</h1>

<input id="name" placeholder="Name">
<input id="price" placeholder="Price">
<input id="stock" placeholder="Stock">
<input id="image" placeholder="Image">
<button onclick="add()">Add</button>

<h2>Products</h2>
<div id="products"></div>

<h2>Orders</h2>
<div id="orders"></div>

<script>

function add(){
 fetch("https://fark618.onrender.com/products",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    name:name.value,
    price:price.value,
    stock:stock.value,
    image:image.value
  })
 }).then(load);
}

function load(){
 fetch("https://fark618.onrender.com/products")
 .then(r=>r.json())
 .then(d=>{
  let html="";
  d.forEach(p=>{
   html+=`<div>${p.name} ₹${p.price}
   <button onclick="del(${p.id})">X</button></div>`;
  });
  products.innerHTML=html;
 });

 fetch("https://fark618.onrender.com/orders")
 .then(r=>r.json())
 .then(d=>{
  let html="";
  d.forEach(o=>{
   html+=`<div>Order ₹${o.total}</div>`;
  });
  orders.innerHTML=html;
 });
}

function del(id){
 fetch("https://fark618.onrender.com/products/"+id,{
  method:"DELETE"
 }).then(load);
}

load();

</script>

</body>
</html>
