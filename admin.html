<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin: 8px;
      width: 200px;
    }

    button {
      padding: 10px 15px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .btn-group {
      margin-top: 10px;
    }

    .btn-group button {
      margin: 5px;
    }
  </style>
</head>

<body>

<h1>Admin Panel 🔧</h1>

<h2>Add Product</h2>

<input id="name" placeholder="Product name">
<input id="price" placeholder="Price">
<input id="stock" placeholder="Stock">
<br>
<input id="image" placeholder="Image URL">

<br><br>
<button onclick="addProduct()">Add Product</button>

<h2>All Products</h2>

<div id="products" class="products"></div>

<script>

// ➕ Add Product
function addProduct() {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const stock = document.getElementById("stock").value;
  const image = document.getElementById("image").value;

  fetch("https://fark618.onrender.com/products", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, price, stock, image })
  })
  .then(() => {
    alert("Product Added!");
    loadProducts();
  });
}

// 📦 Load Products
function loadProducts() {
  fetch("https://fark618.onrender.com/products")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data.forEach(p => {
        html += `
          <div class="card">
            <img src="${p.image}" />
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <p>Stock: ${p.stock}</p>

            <div class="btn-group">
              <button onclick="editProduct(${p.id})">Edit</button>
              <button onclick="deleteProduct(${p.id})">Delete</button>
            </div>
          </div>
        `;
      });

      document.getElementById("products").innerHTML = html;
    });
}

// ❌ Delete
function deleteProduct(id) {
  if (confirm("Delete this product?")) {
    fetch("https://fark618.onrender.com/products/" + id, {
      method: "DELETE"
    })
    .then(() => loadProducts());
  }
}

// ✏️ Edit
function editProduct(id) {
  const name = prompt("New name:");
  const price = prompt("New price:");
  const stock = prompt("New stock:");
  const image = prompt("New image URL:");

  fetch("https://fark618.onrender.com/products/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, price, stock, image })
  })
  .then(() => loadProducts());
}

// 🚀 Auto load
loadProducts();

</script>

</body>
</html>
