<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 250px;
    }

    button {
      padding: 10px 15px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
    }

    img {
      width: 150px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginBox">
  <h2>Admin Login 🔐</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- 🔧 ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
  <h1>Admin Panel 🔧</h1>

  <h2>Add Product</h2>
  <input id="name" placeholder="Product name">
  <input id="price" placeholder="Price">
  <input id="stock" placeholder="Stock">
  <input id="image" placeholder="Image URL">

  <button onclick="addProduct()">Add Product</button>

  <h2>All Products</h2>
  <div id="products"></div>

  <h2>Orders</h2>
  <div id="orders"></div>

</div>

<script>

// ✅ BACKEND URL (IMPORTANT)
const API = "https://fark618-1.onrender.com";

// 🔐 LOGIN
function login() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if (u === "admin" && p === "1234") {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    loadProducts();
    loadOrders();
  } else {
    alert("Wrong login!");
  }
}

// ➕ ADD PRODUCT
function addProduct() {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const stock = document.getElementById("stock").value;
  const image = document.getElementById("image").value;

  fetch(API + "/add-product", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, price, stock, image })
  })
  .then(res => res.json())
  .then(() => {
    alert("Product Added!");
    loadProducts();
  });
}

// 📦 LOAD PRODUCTS
function loadProducts() {
  fetch(API + "/products")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data.forEach(p => {
        html += `
          <div class="card">
            <img src="${p.image}" />
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <p>Stock: ${p.stock}</p>

            <button onclick="deleteProduct('${p._id}')">Delete</button>
            <button onclick="editProduct('${p._id}')">Edit</button>
          </div>
        `;
      });

      document.getElementById("products").innerHTML = html;
    });
}

// 📦 LOAD ORDERS
function loadOrders() {
  fetch(API + "/orders")
    .then(res => res.json())
    .then(data => {

      let html = "";

      data.forEach(o => {

        let grouped = {};

        o.products.forEach(item => {
          if (!grouped[item.name]) {
            grouped[item.name] = { qty: 0, price: item.price };
          }
          grouped[item.name].qty++;
        });

        let itemsHtml = "";

        for (let name in grouped) {
          const item = grouped[name];
          itemsHtml += `
            <li>${name} × ${item.qty} - ₹${item.price * item.qty}</li>
          `;
        }

        html += `
          <div class="card">
            <h3>Order ID: ${o._id}</h3>
            <p><b>Total:</b> ₹${o.total}</p>
            <ul>${itemsHtml}</ul>
          </div>
        `;
      });

      document.getElementById("orders").innerHTML = html;
    });
}

// ✏️ EDIT
function editProduct(id) {
  const name = prompt("New name:");
  const price = prompt("New price:");
  const stock = prompt("New stock:");
  const image = prompt("New image URL:");

  fetch(API + "/products/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, price, stock, image })
  })
  .then(() => loadProducts());
}

// ❌ DELETE
function deleteProduct(id) {
  fetch(API + "/products/" + id, {
    method: "DELETE"
  })
  .then(() => loadProducts());
}

</script>

</body>
</html>
