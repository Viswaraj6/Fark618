<!DOCTYPE html>
<html>

<head>
  <title>Track Order</title>

  <!-- 🔥 இங்க paste பண்ணு -->
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }

    input {
      padding: 10px;
      width: 250px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
    }

    /* 🔥 Timeline CSS இங்க */
    .timeline {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .step {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .step::before {
      content: "";
      position: absolute;
      top: 15px;
      left: -50%;
      width: 100%;
      height: 4px;
      background: #ccc;
      z-index: -1;
    }

    .step:first-child::before {
      display: none;
    }

    .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ccc;
      margin: auto;
    }

    .active {
      background: green !important;
    }
  </style>

</head>
